<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>성동구 아파트 거래 분석 (자동 로드: apt-list.csv)</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    /* Pretendard Variable (Korean UI font) */
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css');

    :root{ --bg:#0b0f1a; --panel:#111827; --ink:#e5e7eb; --muted:#94a3b8; --line:#1f2937; --brand:#60a5fa; --chip:#1f2937 }
    *{ box-sizing:border-box }
    body{ margin:0; background:linear-gradient(180deg,#0b0f1a 0%,#0f1628 100%); color:var(--ink); font-family:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', Segoe UI, Roboto, system-ui; }
    .wrap{ max-width:1200px; margin:24px auto; padding:0 16px 48px }
    header{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:16px }
    h1{ font-size:20px; margin:0; letter-spacing:-.2px }
    .card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.25) }
    .section{ padding:16px }
    .grid{ display:grid; gap:16px }
    .grid.cols-2{ grid-template-columns:1fr 1fr }
    .grid.cols-3{ grid-template-columns:1fr 1fr 1fr }
    label{ font-size:12px; color:var(--muted) }
    input[type="file"],select,button,.chip{ border-radius:10px; border:1px solid var(--line); background:#0d1426; color:var(--ink); padding:10px 12px }
    input[type="text"]{ border-radius:10px; border:1px solid var(--line); background:#0d1426; color:var(--ink); padding:10px 12px; width:100% }
    button{ cursor:pointer }
    button.primary{ background:var(--brand); color:#081226; border:none }
    .row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap }
    .chips{ display:flex; gap:8px; flex-wrap:wrap }
    .chip{ background:var(--chip); cursor:pointer }
    .chip.active{ outline:2px solid var(--brand) }
    .list{ max-height:360px; overflow:auto; border:1px solid var(--line); border-radius:12px }
    .item{ display:flex; justify-content:space-between; gap:12px; padding:10px 12px; border-bottom:1px dashed #1f2937; cursor:pointer }
    .item:hover{ background:#0d1426 }
    .item.active{ background:#11203b }
    table{ width:100%; border-collapse:collapse; font-size:13px }
    th,td{ padding:10px 8px; border-bottom:1px solid #1f2937; text-align:right }
    th:first-child,td:first-child{ text-align:left }
    .pill{ display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border:1px solid var(--line); border-radius:999px; color:var(--muted) }
    .kpi{ display:flex; gap:16px; flex-wrap:wrap }
    .kpi>div{ background:#0d1426; border:1px solid var(--line); border-radius:12px; padding:12px 16px; min-width:160px }
    .kpi .v{ font-size:18px }
    .hint{ color:var(--muted); font-size:12px }
    a.btn{ color:#081226; background:var(--brand); border-radius:10px; padding:8px 12px; text-decoration:none; display:inline-flex; align-items:center; gap:6px }
    canvas{display:block !important;max-width:100% !important;height:300px !important;max-height:300px !important}
    #errMsg{ white-space:pre-line }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>성동구 아파트 거래 분석 (자동: <code>apt-list.csv</code>)</h1>
    <span class="pill">자동 로드 · 컬럼 매핑 확인 · 아파트/면적 선택</span>
  </header>

  <div id="err" style="display:none;margin-bottom:12px" class="card section"><div id="errMsg" style="color:#f87171;font-size:13px"></div></div>

  <!-- 인사이트 카드 -->
  <div id="insights" class="grid cols-3" style="margin:16px 0;">
    <div class="card section">
      <div class="hint">2015~마지막</div>
      <div style="font-weight:700;margin:4px 0">최고 증감율 아파트</div>
      <div id="insight15" style="font-size:14px">-</div>
    </div>
    <div class="card section">
      <div class="hint">2019~2023</div>
      <div style="font-weight:700;margin:4px 0">최고 증감율 아파트</div>
      <div id="insight19" style="font-size:14px">-</div>
    </div>
    <div class="card section">
      <div class="hint">2024~마지막</div>
      <div style="font-weight:700;margin:4px 0">최고 증감율 아파트</div>
      <div id="insight24" style="font-size:14px">-</div>
    </div>
  </div>

  <!-- 업로더 카드: 서버 자동 로드이므로 숨김 -->
  <div class="card section grid cols-3" id="uploader" style="display:none">
    <div>
      <label>CSV 파일</label>
      <div class="row">
        <input type="file" id="file" accept=".csv" />
        <button class="primary" id="btnParse">불러오기</button>
        <button id="btnLoadLocal">apt-list.csv 불러오기</button>
      </div>
      <div class="hint" style="margin-top:8px">file:// 로열면 차단될 수 있어 HTTP에서 열어주세요.</div>
    </div>
    <div>
      <label>컬럼 매핑</label>
      <div class="grid">
        <select id="colApt"><option value="">아파트(필수)</option></select>
        <select id="colArea"><option value="">전용면적 m²(필수)</option></select>
        <select id="colYm"><option value="">거래연월(YYYYMM/YYYY-MM)</option></select>
        <select id="colPrice"><option value="">거래금액(원/만원)</option></select>
      </div>
    </div>
    <div>
      <label>검색</label>
      <input id="search" type="text" placeholder="아파트명 검색" />
      <div class="row" style="margin-top:8px">
        <button id="btnReset">초기화</button>
        <a id="btnDownload" class="btn" download="filtered.csv" href="#" style="display:none">필터 결과 CSV 다운로드</a>
      </div>
    </div>
  </div>

  <div class="grid cols-2" style="margin-top:16px">
    <div class="card section">
      <div class="row" style="justify-content:space-between">
        <div>
          <div style="font-weight:600;margin-bottom:8px">아파트 리스트</div>
          <div class="hint">총 <span id="aptCount">0</span>개 단지</div>
        </div>
      </div>
      <div class="list" id="aptList"></div>
    </div>
    <div class="card section">
      <div style="font-weight:600;margin-bottom:8px">면적 그룹</div>
      <div class="hint">단위: m² (괄호안은 평)</div>
      <div class="chips" id="areaChips"></div>
    </div>
  </div>

  <div class="card section" style="margin-top:16px">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div>
        <div style="font-weight:700;font-size:18px" id="titleSel">거래 내역</div>
        <div class="hint" id="subSel">아파트와 면적을 선택하세요</div>
      </div>
      <div class="kpi" id="kpiBox" style="display:none">
        <div><div class="k">최근월 평균가</div><div class="v" id="kpiLast">-</div></div>
        <div><div class="k">전월 대비</div><div class="v" id="kpiMom">-</div></div>
        <div><div class="k">표본</div><div class="v" id="kpiCnt">-</div></div>
      </div>
    </div>
    <canvas id="chart"></canvas>
    <div style="overflow:auto;margin-top:10px">
      <table id="tbl">
        <thead>
          <tr>
            <th>연월</th>
            <th>거래건수</th>
            <th>평균가(만원)</th>
            <th>최저~최고(만원)</th>
            <th>전월대비%</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function(){
  const DEFAULT_CSV = 'apt-list.csv';
  let RAW = [], HEAD = [];
  let COL = { apt:'', area:'', ym:'', price:'' };
  let currentApt = null, currentArea = null;
  let chart = null;

  const el = {
    file: qs('#file'), parse: qs('#btnParse'), loadLocal: qs('#btnLoadLocal'), reset: qs('#btnReset'), download: qs('#btnDownload'),
    colApt: qs('#colApt'), colArea: qs('#colArea'), colYm: qs('#colYm'), colPrice: qs('#colPrice'),
    search: qs('#search'), aptList: qs('#aptList'), aptCount: qs('#aptCount'), chips: qs('#areaChips'),
    title: qs('#titleSel'), sub: qs('#subSel'), kpiBox: qs('#kpiBox'), kpiLast: qs('#kpiLast'), kpiMom: qs('#kpiMom'), kpiCnt: qs('#kpiCnt'),
    tbl: qs('#tbl tbody'), canvas: qs('#chart')
  };

  document.addEventListener('DOMContentLoaded', function(){
    setFixedChartHeight();
    loadLocalCsv();
  });

  // 이벤트 (업로더 카드는 숨겨졌지만 기능 유지)
  if(el.parse){ el.parse.addEventListener('click', function(){ if(!el.file.files[0]){ alert('CSV 파일을 선택하세요'); return; } parseWithPapa(el.file.files[0]); }); }
  if(el.loadLocal){ el.loadLocal.addEventListener('click', loadLocalCsv); }
  if(el.reset){ el.reset.addEventListener('click', function(){ currentApt=null; currentArea=null; if(el.search) el.search.value=''; renderAptList(); renderAreas(); renderTable([]); setTitle(); }); }
  if(el.search){ el.search.addEventListener('input', function(){ renderAptList(); }); }
  ;[el.colApt, el.colArea, el.colYm, el.colPrice].forEach(function(s){ if(!s) return; s.addEventListener('change', function(){ COL={ apt:el.colApt.value, area:el.colArea.value, ym:el.colYm.value, price:el.colPrice.value }; renderAptList(); renderAreas(); setTitle(); }); });

  function parseWithPapa(fileOrUrl){
    var opt = { header:true, skipEmptyLines:true, complete:function(res){
      try{
        RAW = res.data.map(function(row){ return Object.fromEntries(Object.entries(row).map(function(kv){ var k=kv[0], v=kv[1]; return [String(k).trim(), (v==null?'':String(v)).trim()]; })); });
        HEAD = res.meta.fields.map(function(f){ return String(f).trim(); });
        mountColumnOptions(); autoDetectColumns(); renderAptList();
        computeInsights();
      }catch(err){ showErr('CSV 파싱 후 처리 중 오류: ' + (err && err.message ? err.message : err)); }
    }, error:function(e){ showErr('CSV 파싱 오류: ' + (e && e.message ? e.message : e)); } };
    if(typeof fileOrUrl==='string') Papa.parse(fileOrUrl, Object.assign({}, opt, {download:true})); else Papa.parse(fileOrUrl,opt);
  }

  function loadLocalCsv(){
    fetch(DEFAULT_CSV,{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('['+r.status+'] '+r.statusText); return r.blob(); })
      .then(function(){ parseWithPapa(DEFAULT_CSV); })
      .catch(function(e){ showErr('apt-list.csv 자동 로드 실패: ' + (e && e.message ? e.message : e) + '\n\nHTTP 서버에서 열어주세요 (예: python -m http.server)'); });
  }

  function mountColumnOptions(){ [el.colApt, el.colArea, el.colYm, el.colPrice].forEach(function(sel){ if(!sel) return; sel.innerHTML = '<option value="">선택</option>' + HEAD.map(function(h){ return '<option value="'+esc(h)+'">'+esc(h)+'</option>'; }).join(''); }); }
  function autoDetectColumns(){ function pick(alts){ for(var i=0;i<HEAD.length;i++){ var h=HEAD[i]; for(var j=0;j<alts.length;j++){ if(new RegExp(alts[j],'i').test(h)) return h; } } return ''; }
    if(el.colApt)  el.colApt.value  = pick(['아파트','단지','단지명','apt','apartment','건물명']);
    if(el.colArea) el.colArea.value = pick(['전용','면적','m2','m²','area']);
    if(el.colYm)   el.colYm.value   = pick(['ym','연월','거래연월','년월','yyyymm','month']);
    if(el.colPrice)el.colPrice.value= pick(['금액','가격','매매','거래','price','amount']);
    COL={ apt: (el.colApt?el.colApt.value:''), area:(el.colArea?el.colArea.value:''), ym:(el.colYm?el.colYm.value:''), price:(el.colPrice?el.colPrice.value:'') };
  }

  function renderAptList(){
    if(!COL.apt){ el.aptList.innerHTML = '<div class="section hint">아파트(단지) 컬럼을 매핑하세요.</div>'; el.aptCount.textContent='0'; return; }
    var search = norm(el.search?el.search.value:'');
    var map = new Map();
    RAW.forEach(function(r){ var name=(r[COL.apt]||'').trim(); if(!name) return; if(search && norm(name).indexOf(search)===-1) return; map.set(name, 1+(map.get(name)||0)); });
    var items = Array.from(map.entries()).sort(function(a,b){ return a[0].localeCompare(b[0],'ko'); });
    el.aptCount.textContent = items.length;
    el.aptList.innerHTML = items.map(function(ent){ var name=ent[0], count=ent[1]; return '<div class="item '+(name===currentApt?'active':'')+'" data-apt="'+esc(name)+'">\n  <div>'+esc(name)+'</div>\n  <div class="hint">'+count.toLocaleString()+'건</div>\n</div>'; }).join('');
    qsa('#aptList .item').forEach(function(it){ it.addEventListener('click', function(){ currentApt = it.getAttribute('data-apt'); currentArea=null; renderAptList(); renderAreas(); setTitle(); updateFilteredDownload(); }); });
  }

  function renderAreas(){ if(!currentApt || !COL.area){ el.chips.innerHTML=''; return; }
    var rows = RAW.filter(function(r){ return (r[COL.apt]||'').trim()===currentApt; });
    var map = new Map(); rows.forEach(function(r){ var a=parseArea(r[COL.area]); if(isFinite(a)){ var key=roundArea(a); map.set(key,1+(map.get(key)||0)); } });
    var items = Array.from(map.entries()).sort(function(a,b){ return a[0]-b[0]; });
    el.chips.innerHTML = items.map(function(ent){ var a=ent[0], c=ent[1], py=a*0.3025; return '<div class="chip '+(currentArea===a?'active':'')+'" data-area="'+a+'">'+a.toFixed(1)+' m² ('+py.toFixed(1)+'평) <span class="hint">'+c+'건</span></div>'; }).join('');
    qsa('#areaChips .chip').forEach(function(ch){ ch.addEventListener('click', function(){ currentArea=parseFloat(ch.getAttribute('data-area')); renderAreas(); setTitle(); draw(); updateFilteredDownload(); }); });
  }

  function draw(){ var rows=getFilteredRows(); var byMonth=aggregateByMonth(rows); renderTable(byMonth); renderChart(byMonth); }

  function renderTable(byMonth){
    var tbody = byMonth.slice().reverse().map(function(m){ var momTxt=(m.mom==null)?'-':((m.mom>0?'+':'')+m.mom.toFixed(1)+'%'); var momColor=(m.mom>0?'#22c55e':(m.mom<0?'#ef4444':'#94a3b8')); return '<tr>\n  <td>'+m.ym+'</td>\n  <td>'+m.count+'</td>\n  <td>'+fmt(m.avg/10000)+'</td>\n  <td>'+fmt(m.min/10000)+' ~ '+fmt(m.max/10000)+'</td>\n  <td style="color:'+momColor+'">'+momTxt+'</td>\n</tr>'; }).join('');
    el.tbl.innerHTML = tbody;
    if(byMonth.length){ var last=byMonth[byMonth.length-1]; el.kpiBox.style.display='flex'; el.kpiLast.textContent=fmt(last.avg/10000)+' 만원'; el.kpiMom.textContent=(last.mom==null?'-':((last.mom>0?'+':'')+last.mom.toFixed(1)+'%')); el.kpiCnt.textContent=last.count.toLocaleString()+'건'; } else { el.kpiBox.style.display='none'; }
  }

  function renderChart(byMonth){
    var labels = byMonth.map(function(m){ return m.ym; });
    var avg = byMonth.map(function(m){ return Math.round(m.avg/10000); });
    var mom = byMonth.map(function(m){ return m.mom; });
    var yStats=rangeStats(avg), yPad=(yStats.max-yStats.min)*0.10, yMinMax=niceBounds(yStats.min-yPad, yStats.max+yPad);
    var momVals = mom.filter(function(v){ return v!=null && isFinite(v); });
    var y1Stats = momVals.length? rangeStats(momVals) : {min:-20,max:20};
    var y1Pad=(y1Stats.max-y1Stats.min)*0.10, y1MinMax=niceBounds(y1Stats.min-y1Pad, y1Stats.max+y1Pad);
    if(chart){ chart.destroy(); }
    const ctx = document.getElementById('myChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          { label: '평균가(만원)', data: avg, tension: 0.25, yAxisID: 'y' },
          { label: '전월대비%', data: mom, type: 'bar', yAxisID: 'y1' }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            position: 'left',
            min: yMinMax[0],
            max: yMinMax[1],
            title: { display: true, text: '만원' },
            ticks: {
              callback: function(v) {
                return Number(v).toLocaleString();
              }
            }
          },
          y1: {
            position: 'right',
            min: y1MinMax[0],
            max: y1MinMax[1],
            grid: { drawOnChartArea: false },
            title: { display: true, text: '%' }
          }
        },
        plugins: {
          legend: { display: true },
          tooltip: { mode: 'index', intersect: false }
        }
      }
    });   
    
   // chart = new Chart(el.canvas.getContext('2d'),{ type:'line', data:{ labels:labels, datasets:[ {label:'평균가(만원)', data:avg, tension:0.25, yAxisID:'y'}, {label:'전월대비%', data:mom, type:'bar', yAxisID:'y1'} ] }, options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{position:'left', min:yMinMax[0], max:yMinMax[1], title:{display:true,text:'만원'}, ticks:{ callback:function(v){ return Number(v).toLocaleString(); } } }, y1:{position:'right', min:y1MinMax[0], max:y1MinMax[1], grid:{drawOnChartArea:false}, title:{display:true,text:'%'} } }, plugins:{ legend:{display:true}, tooltip:{mode:'index', intersect:false} } });
  }

  function aggregateByMonth(rows){ var map=new Map(); rows.forEach(function(r){ var ym=normYm(r[COL.ym]); if(!ym) return; var price=parsePrice(r[COL.price]); if(!isFinite(price)) return; var s=map.get(ym)||{sum:0,min:Infinity,max:-Infinity,count:0}; s.sum+=price; s.min=Math.min(s.min,price); s.max=Math.max(s.max,price); s.count++; map.set(ym,s); }); var items=Array.from(map.entries()).map(function(ent){ var ym=ent[0], s=ent[1]; return {ym:ym, avg:s.sum/s.count, min:s.min, max:s.max, count:s.count}; }).sort(function(a,b){ return a.ym.localeCompare(b.ym); }); for(var i=0;i<items.length;i++){ var prev=items[i-1]; items[i].mom = prev? ((items[i].avg-prev.avg)/prev.avg*100) : null; } return items; }

  function getFilteredRows(){ if(!currentApt || !COL.area) return []; return RAW.filter(function(r){ return (r[COL.apt]||'').trim()===currentApt && sameArea(parseArea(r[COL.area]), currentArea); }); }
  function updateFilteredDownload(){ var rows=getFilteredRows(); if(!rows.length){ el.download.style.display='none'; return; } var csv=toCSV(rows); var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}); var url=URL.createObjectURL(blob); el.download.href=url; el.download.style.display='inline-flex'; }
  function setTitle(){ var a=currentApt?currentApt:'거래 내역'; var b=currentArea?(currentArea.toFixed(1)+' m² ('+(currentArea*0.3025).toFixed(1)+'평)'):''; el.title.textContent=currentArea? (a+' · '+b) : a; el.sub.textContent = (!currentApt? '아파트와 면적을 선택하세요' : (currentArea? '월별 평균가/증감률' : '면적을 선택하세요')); if(currentApt && currentArea){ draw(); } else { el.tbl.innerHTML=''; if(chart) chart.destroy(); } }

  // ---------- 인사이트: 아파트별 기간 최저~최고 증감률 상위 ----------
  function computeInsights(){
    try{
      var aptMap=new Map(); // apt -> Map(ym->{sum,count})
      RAW.forEach(function(r){ var apt=(r[COL.apt]||'').trim(); if(!apt) return; var ym=normYm(r[COL.ym]); if(!ym) return; var price=parsePrice(r[COL.price]); if(!isFinite(price)) return; var m=aptMap.get(apt); if(!m){ m=new Map(); aptMap.set(apt,m);} var s=m.get(ym)||{sum:0,count:0}; s.sum+=price; s.count++; m.set(ym,s); });
      var seriesByApt=new Map(); aptMap.forEach(function(monthMap,apt){ var arr=Array.from(monthMap.entries()).map(function(ent){return {ym:ent[0], avg:ent[1].sum/ent[1].count};}).sort(function(a,b){return a.ym.localeCompare(b.ym);}); seriesByApt.set(apt,arr); });
      var allYms=[]; aptMap.forEach(function(m){ m.forEach(function(_,ym){ allYms.push(ym); }); }); if(!allYms.length) return; allYms.sort(); var lastYm=allYms[allYms.length-1];
      var r15=maxGrowth(seriesByApt,'2015-01',lastYm); var r19=maxGrowth(seriesByApt,'2019-01','2023-12'); var r24=maxGrowth(seriesByApt,'2024-01',lastYm);
      renderInsights('insight15',r15); renderInsights('insight19',r19); renderInsights('insight24',r24);
    }catch(e){ console.error(e); }
  }
  function maxGrowth(seriesByApt,startYm,endYm){ var best=null; seriesByApt.forEach(function(arr,apt){ var seg=arr.filter(function(p){ return p.ym>=startYm && p.ym<=endYm; }); if(seg.length<2) return; var minV=Infinity,maxV=-Infinity,minYm='',maxYm=''; seg.forEach(function(p){ if(p.avg<minV){minV=p.avg;minYm=p.ym;} if(p.avg>maxV){maxV=p.avg;maxYm=p.ym;} }); if(!isFinite(minV)||!isFinite(maxV)||minV<=0) return; var pct=(maxV-minV)/minV*100; if(!best||pct>best.pct){ best={apt:apt,pct:pct,min:minV,max:maxV,minYm:minYm,maxYm:maxYm}; } }); return best; }
  function renderInsights(id,r){ var box=qs('#'+id); if(!box) return; if(!r){ box.innerHTML='<span class="hint">데이터 없음</span>'; return;} box.innerHTML='<div style="font-weight:600">'+esc(r.apt)+'</div>'+'<div class="hint">최저 '+fmt(r.min/10000)+' 만원 ('+r.minYm+') → 최고 '+fmt(r.max/10000)+' 만원 ('+r.maxYm+')</div>'+'<div style="margin-top:6px;font-size:22px;font-weight:800">'+r.pct.toFixed(1)+'%</div>'; }

  // ---------- 유틸 ----------
  function setFixedChartHeight(){ el.canvas.style.height='300px'; el.canvas.style.maxHeight='300px'; }
  function norm(s){ return String(s).toLowerCase().replace(/\s+/g,''); }
  function qs(s,sc){ return (sc||document).querySelector(s); }
  function qsa(s,sc){ return Array.prototype.slice.call((sc||document).querySelectorAll(s)); }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(m){
      var map = {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"};
      return map[m] || m;
    });
  }
  function parseArea(v){ if(v==null) return NaN; var n=+String(v).replace(/[^0-9.]/g,''); return isFinite(n)? n : NaN; }
  function roundArea(a){ return Math.round(a*10)/10; }
  function sameArea(a,b){ if(!isFinite(a)||!isFinite(b)) return false; return roundArea(a)===roundArea(b); }
  function normYm(v){ if(!v) return ''; var s=String(v).trim(); var m=s.match(/^(\d{4})\D?(\d{1,2})$/)||s.match(/^(\d{4})\D(\d{1,2})\D/); if(m){ var y=m[1], mo=('0'+m[2]).slice(-2); return y+'-'+mo; } return ''; }
  function parsePrice(v){ if(v==null||v==='') return NaN; var n=+String(v).replace(/[^0-9.-]/g,''); if(!isFinite(n)) return NaN; if(n<1000000) return n*10000; return n; }
  function fmt(n){ return isFinite(n)? Math.round(n).toLocaleString() : '-'; }
  function toCSV(rows){ if(!rows.length) return ''; var head=Object.keys(rows[0]); var escCsv=function(s){ return '"'+String(s).replace(/"/g,'""')+'"'; }; return [head.join(',')].concat(rows.map(function(r){ return head.map(function(h){ return escCsv(r[h]==null?'':r[h]); }).join(','); })).join('\n'); }
  function rangeStats(arr){ var min=Infinity,max=-Infinity; arr.forEach(function(v){ if(v==null||!isFinite(v)) return; if(v<min) min=v; if(v>max) max=v; }); if(min===Infinity){ min=0; max=1; } if(min===max){ min=min*0.9; max=max*1.1+1; } return {min:min,max:max}; }
  function niceBounds(min,max){ var span=Math.max(1,max-min); var step=niceNum(span/6,true); var niceMin=Math.floor(min/step)*step; var niceMax=Math.ceil(max/step)*step; return [niceMin,niceMax]; }
  function niceNum(x,round){ var exp=Math.floor(Math.log10(x)); var f=x/Math.pow(10,exp); var nf; if(round){ if(f<1.5) nf=1; else if(f<3) nf=2; else if(f<7) nf=5; else nf=10; } else { if(f<=1) nf=1; else if(f<=2) nf=2; else if(f<=5) nf=5; else nf=10; } return nf*Math.pow(10,exp); }
  function showErr(m){ var box=qs('#err'); var msgEl=qs('#errMsg'); if(box&&msgEl){ msgEl.textContent=String(m); box.style.display='block'; } console.error(m); }
})();
