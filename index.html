<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>성동구 아파트 거래 분석 (자동 로드: apt-list.csv)</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    body{margin:0;font-family:system-ui;background:#0b0f1a;color:#e5e7eb}
    .wrap{max-width:1200px;margin:24px auto;padding:0 16px 48px}
    canvas{display:block !important;max-width:100% !important;height:400px !important;max-height:400px !important}
  </style>
</head>
<body>
<div class="wrap">
  <h1>성동구 아파트 거래 분석 (자동: apt-list.csv)</h1>
  <canvas id="chart"></canvas>
</div>
<script>
(function(){
  const ctx=document.getElementById('chart').getContext('2d');
  const chart=new Chart(ctx,{
    type:'line',
    data:{labels:['1월','2월','3월'],datasets:[{label:'예시',data:[10,20,30]}]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{y:{beginAtZero:true}}}
  });
})();
</script>
</body>
</html>
